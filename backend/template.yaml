AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Serverless Task Management System - backend

Globals:
  Function:
    Runtime: python3.13
    Architectures: [arm64]
    Timeout: 10
    MemorySize: 128
    LoggingConfig:
      LogFormat: JSON
    Environment:
      Variables:
        # Browser origins allowed to call the API
        ALLOWED_ORIGINS: https://main.dou2fg6xeliu9.amplifyapp.com,http://localhost:3000

Resources:
  # ---------- Authentication ----------
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub ${AWS::StackName}-users
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      Schema:
        - Name: email
          Required: true
          Mutable: true
        - Name: name
          Required: true
          Mutable: true
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: web
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_PASSWORD_AUTH
      PreventUserExistenceErrors: ENABLED

  AdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: Admin
      Description: Creates, assigns and manages all tasks
      UserPoolId: !Ref UserPool
      Precedence: 0

  TeamMemberGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: TeamMember
      Description: Views and updates assigned tasks
      UserPoolId: !Ref UserPool
      Precedence: 1

  TasksTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${AWS::StackName}-tasks
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: taskId
          AttributeType: S
        - AttributeName: assigneeId
          AttributeType: S
      KeySchema:
        - AttributeName: taskId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: AssigneeIndex
          KeySchema:
            - AttributeName: assigneeId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      # Streams every change  to the TaskNotification Lambda.
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES

  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${AWS::StackName}-users
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
    
  TaskApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: dev
      Cors:
        # Single value only; the Lambdas enforce the ALLOWED_ORIGINS allowlist.
        AllowOrigin: "'*'"
        AllowHeaders: "'Authorization,Content-Type'"
        AllowMethods: "'GET,POST,PUT,OPTIONS'"
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt UserPool.Arn
      GatewayResponses:
        DEFAULT_4XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"

  # Task Creation Lambda (Admin only)
  CreateTaskFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: nodejs24.x
      CodeUri: src/tasks/
      Handler: create.handler
      Environment:
        Variables:
          TASKS_TABLE: !Ref TasksTable
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
              Resource: !GetAtt TasksTable.Arn
      Events:
        CreateTask:
          Type: Api
          Properties:
            RestApiId: !Ref TaskApi
            Path: /tasks
            Method: post

  # Lists all tasks for Admins, assigned tasks for Team Members
  ListTasksFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: nodejs24.x
      CodeUri: src/tasks/
      Handler: list.handler
      Environment:
        Variables:
          TASKS_TABLE: !Ref TasksTable
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Scan
              Resource: !GetAtt TasksTable.Arn
            - Effect: Allow
              Action: dynamodb:Query
              Resource: !Sub ${TasksTable.Arn}/index/AssigneeIndex
      Events:
        ListTasks:
          Type: Api
          Properties:
            RestApiId: !Ref TaskApi
            Path: /tasks
            Method: get

  # Returns one task to an Admin or its assignee
  GetTaskFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: nodejs24.x
      CodeUri: src/tasks/
      Handler: get.handler
      Environment:
        Variables:
          TASKS_TABLE: !Ref TasksTable
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
              Resource: !GetAtt TasksTable.Arn
      Events:
        GetTask:
          Type: Api
          Properties:
            RestApiId: !Ref TaskApi
            Path: /tasks/{taskId}
            Method: get

  # Task Update Lambda (Admins: any field; Team Members: status only)
  UpdateTaskFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: nodejs24.x
      CodeUri: src/tasks/
      Handler: update.handler
      Environment:
        Variables:
          TASKS_TABLE: !Ref TasksTable
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
              Resource: !GetAtt TasksTable.Arn
      Events:
        UpdateTask:
          Type: Api
          Properties:
            RestApiId: !Ref TaskApi
            Path: /tasks/{taskId}
            Method: put

  # Task Assignment Lambda (Admin only)
  AssignTaskFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: nodejs24.x
      CodeUri: src/tasks/
      Handler: assign.handler
      Environment:
        Variables:
          TASKS_TABLE: !Ref TasksTable
          USERS_TABLE: !Ref UsersTable
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:UpdateItem
              Resource: !GetAtt TasksTable.Arn
            - Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt UsersTable.Arn
      Events:
        AssignTask:
          Type: Api
          Properties:
            RestApiId: !Ref TaskApi
            Path: /tasks/{taskId}/assign
            Method: put

  # Lists users so Admins can choose an assignee (Admin only)
  ListUsersFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: nodejs24.x
      CodeUri: src/tasks/
      Handler: users.handler
      Environment:
        Variables:
          USERS_TABLE: !Ref UsersTable
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:Scan
              Resource: !GetAtt UsersTable.Arn
      Events:
        ListUsers:
          Type: Api
          Properties:
            RestApiId: !Ref TaskApi
            Path: /users
            Method: get
            
  # One topic for all task emails. Each user's email subscription has a filter
  NotificationsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub ${AWS::StackName}-notifications
      DisplayName: Task Manager

  # Task Status Notification Lambda: reads task changes from the DynamoDB
  # stream and emails the assignee (assigned, deadline changed) or admins (status changed).
  TaskNotificationFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: nodejs24.x
      CodeUri: src/tasks/
      Handler: notify.handler
      Environment:
        Variables:
          USERS_TABLE: !Ref UsersTable
          TOPIC_ARN: !Ref NotificationsTopic
      Policies:
        - Statement:
            - Effect: Allow
              Action: sns:Publish
              Resource: !Ref NotificationsTopic
            - Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt UsersTable.Arn
      Events:
        TaskChanges:
          Type: DynamoDB
          Properties:
            Stream: !GetAtt TasksTable.StreamArn
            StartingPosition: LATEST
            BatchSize: 10
            MaximumRetryAttempts: 2

  # Adds every newly confirmed user to the TeamMember group.
  PostConfirmationFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/auth/
      Handler: post_confirmation.handler
      Environment:
        Variables:
          DEFAULT_GROUP: TeamMember
          USERS_TABLE: !Ref UsersTable
          TOPIC_ARN: !Ref NotificationsTopic
      Policies:
        - Statement:
            - Effect: Allow
              Action: cognito-idp:AdminAddUserToGroup
              Resource: !Sub arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/*
            - Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt UsersTable.Arn
            - Effect: Allow
              Action: sns:Subscribe
              Resource: !Ref NotificationsTopic 
      Events:
        CognitoPostConfirmation:
          Type: Cognito
          Properties:
            UserPool: !Ref UserPool
            Trigger: PostConfirmation

Outputs:
  Region:
    Value: !Ref AWS::Region
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  ApiUrl:
    Description: Base URL for the task API stage
    Value: !Sub https://${TaskApi}.execute-api.${AWS::Region}.amazonaws.com/dev/
  TasksTableName:
    Value: !Ref TasksTable
  UsersTableName:
    Value: !Ref UsersTable
  NotificationsTopicArn:
    Value: !Ref NotificationsTopic
